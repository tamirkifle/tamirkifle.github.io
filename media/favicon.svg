<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <style>
    /* A standalone favicon can't see the site's data-theme attribute, so the
       ramp has to key off the OS scheme instead. Dark tab bars get the light
       rust ramp and vice versa, matching the in-page mark. */
