      --f1a: #2E1203; --f1b: #5A2708;
      --f2a: #7A3309; --f2b: #A34B12;
      --f3a: #A34B12; --f3b: #C2661C;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --f1a: #C2661C; --f1b: #DD8235;
        --f2a: #E9944E; --f2b: #F0AC74;
        --f3a: #F5CDA4; --f3b: #FBE3C6;
      }
    }
  </style>
